name: CD to AWS EC2

# Kịch bản này sẽ tự động chạy mỗi khi có code mới push lên nhánh 'main'
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Kết nối SSH vào EC2 và tự động Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        # Lệnh để GitHub robot gõ hộ em trên máy chủ EC2
        script: |
          cd Group-7-Project-Online-Auction-System
          git pull origin main
          sudo docker stop auction-server || true
          sudo docker rm auction-server || true
          sudo docker build -t bidmaster-server .
          sudo docker run -d -p 3636:3636 --name auction-server bidmaster-server
          sudo docker image prune -f
