name: CD to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Kết nối SSH vào EC2 và tự động Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Tự động cài đặt ngrok nếu trên EC2 chưa có
          if ! command -v ngrok &> /dev/null; then
            echo "Installing ngrok..."
            curl -s https://ngrok-agent.s3.amazonaws.com/files.bin/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/ngrok.gpg
            echo "deb [signed-by=/etc/apt/keyrings/ngrok.gpg] https://ngrok-agent.s3.amazonaws.com/files.bin/html/ stable main" | sudo tee /etc/apt/sources.list.d/ngrok.list
            sudo apt-get update && sudo apt-get install -y ngrok
          fi

          # 2. Cấu hình Authtoken cho ngrok từ GitHub Secrets
          if [ -z "${{ secrets.NGROK_AUTHTOKEN }}" ]; then
            echo "WARNING: NGROK_AUTHTOKEN secret is empty! Please add NGROK_AUTHTOKEN in GitHub Secrets."
          else
            ngrok config add-authtoken "${{ secrets.NGROK_AUTHTOKEN }}"
          fi

          # 3. Thực hiện deploy server bằng Docker như cũ
          cd Group-7-Project-Online-Auction-System
          git pull origin main
          sudo docker stop auction-server || true
          sudo docker rm auction-server || true
          sudo docker build -t bidmaster-server .
          sudo docker run -d -p 3636:3636 --name auction-server bidmaster-server
          sudo docker image prune -f

          # 4. Tự động kiểm tra và chạy ngrok ngầm (nếu chưa chạy)
          if ! pgrep -x "ngrok" > /dev/null; then
            echo "Starting ngrok tunnel..."
            # Chạy thử 5 giây ghi thẳng ra log để kiểm tra lỗi nếu có
            timeout 5 ngrok tcp 3636 --log=stdout || echo "Finished direct diagnostic run."
            
            # Chạy ngầm thực sự
            nohup ngrok tcp 3636 > ~/ngrok.log 2>&1 &
            sleep 3
          fi

          # 5. Lấy địa chỉ IP kết nối của ngrok và in trực tiếp ra log của GitHub Actions
          echo "=== NGROK TUNNEL ADDRESS ==="
          if curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[^"]*'; then
            echo "Successfully retrieved ngrok address."
          else
            echo "Chưa lấy được địa chỉ. Chi tiết lỗi từ file ~/ngrok.log:"
            cat ~/ngrok.log || echo "Không tìm thấy file log ~/ngrok.log"
          fi
          echo "============================"
